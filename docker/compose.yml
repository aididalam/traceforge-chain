name: traceforge-chain

services:

  validator1:
    image: ${BESU_IMAGE}
    container_name: traceforge-validator1
    restart: unless-stopped

    command:
      - --data-path=/var/lib/besu
      - --genesis-file=/config/genesis.json
      - --profile=ENTERPRISE
      - --nat-method=NONE
      - --p2p-host=${VALIDATOR1_IP}
      - --p2p-port=${P2P_PORT}
      - --min-gas-price=${MIN_GAS_PRICE}

      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT
      - --host-allowlist=*

    volumes:
      - ../runtime/shared/genesis.json:/config/genesis.json:ro
      - ../runtime/validator1/data:/var/lib/besu

    ports:
      - "127.0.0.1:${RPC_PORT}:8545"

    networks:
      traceforge:
        ipv4_address: ${VALIDATOR1_IP}


  validator2:
    image: ${BESU_IMAGE}
    container_name: traceforge-validator2
    restart: unless-stopped

    command:
      - --data-path=/var/lib/besu
      - --genesis-file=/config/genesis.json
      - --profile=ENTERPRISE
      - --nat-method=NONE
      - --p2p-host=${VALIDATOR2_IP}
      - --p2p-port=${P2P_PORT}
      - --bootnodes=/config/bootnodes.txt
      - --min-gas-price=${MIN_GAS_PRICE}

    volumes:
      - ../runtime/shared/genesis.json:/config/genesis.json:ro
      - ../runtime/shared/bootnodes.txt:/config/bootnodes.txt:ro
      - ../runtime/validator2/data:/var/lib/besu

    networks:
      traceforge:
        ipv4_address: ${VALIDATOR2_IP}


  validator3:
    image: ${BESU_IMAGE}
    container_name: traceforge-validator3
    restart: unless-stopped

    command:
      - --data-path=/var/lib/besu
      - --genesis-file=/config/genesis.json
      - --profile=ENTERPRISE
      - --nat-method=NONE
      - --p2p-host=${VALIDATOR3_IP}
      - --p2p-port=${P2P_PORT}
      - --bootnodes=/config/bootnodes.txt
      - --min-gas-price=${MIN_GAS_PRICE}

    volumes:
      - ../runtime/shared/genesis.json:/config/genesis.json:ro
      - ../runtime/shared/bootnodes.txt:/config/bootnodes.txt:ro
      - ../runtime/validator3/data:/var/lib/besu

    networks:
      traceforge:
        ipv4_address: ${VALIDATOR3_IP}


  validator4:
    image: ${BESU_IMAGE}
    container_name: traceforge-validator4
    restart: unless-stopped

    command:
      - --data-path=/var/lib/besu
      - --genesis-file=/config/genesis.json
      - --profile=ENTERPRISE
      - --nat-method=NONE
      - --p2p-host=${VALIDATOR4_IP}
      - --p2p-port=${P2P_PORT}
      - --bootnodes=/config/bootnodes.txt
      - --min-gas-price=${MIN_GAS_PRICE}

    volumes:
      - ../runtime/shared/genesis.json:/config/genesis.json:ro
      - ../runtime/shared/bootnodes.txt:/config/bootnodes.txt:ro
      - ../runtime/validator4/data:/var/lib/besu

    networks:
      traceforge:
        ipv4_address: ${VALIDATOR4_IP}


networks:
  traceforge:
    name: ${DOCKER_NETWORK_NAME}
    driver: bridge

    ipam:
      config:
        - subnet: ${DOCKER_SUBNET}
